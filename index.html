<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kids Magic Tracing Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
      --text: #2d3436;
      --shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: var(--text);
    }

    /* --- SCREENS --- */
    .screen {
      display: none;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      animation: fadeIn 0.4s ease;
    }
    .screen.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    /* --- HOME SCREEN --- */
    #homeScreen {
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .title {
      font-family: 'Baloo 2', cursive;
      font-size: 3.2rem;
      color: #fff;
      text-shadow: 3px 3px 0 #6c5ce7, 6px 6px 0 rgba(0,0,0,0.1);
      margin-bottom: 30px;
      text-align: center;
      line-height: 1;
    }
    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
      max-width: 400px;
    }
    .cat-btn {
      border: none;
      border-radius: 25px;
      padding: 25px 15px;
      font-family: 'Baloo 2', cursive;
      font-size: 1.6rem;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(0,0,0,0.2), inset 0 -4px 0 rgba(0,0,0,0.1);
      transition: transform 0.1s, box-shadow 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .cat-btn:active { transform: translateY(8px); box-shadow: 0 0px 0 rgba(0,0,0,0.2); }
    .cat-btn span { font-size: 2.2rem; }
    
    .btn-abc { background: linear-gradient(to bottom, #fd79a8, #e84393); }
    .btn-123 { background: linear-gradient(to bottom, #74b9ff, #0984e3); }
    .btn-arabic { background: linear-gradient(to bottom, #55efc4, #00b894); }
    .btn-shapes { background: linear-gradient(to bottom, #ffeaa7, #fdcb6e); color: #d35400; text-shadow: 1px 1px 0 #fff; }

    /* --- SELECTION SCREEN --- */
    #selectScreen { background: #f8f9fa; }
    .header {
      display: flex;
      align-items: center;
      padding: 15px 20px;
      background: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      z-index: 10;
    }
    .back-btn {
      background: #dfe6e9;
      border: none;
      border-radius: 15px;
      padding: 10px 15px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      color: #2d3436;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 0 #b2bec3;
    }
    .back-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #b2bec3; }
    .header-title {
      font-family: 'Baloo 2', cursive;
      font-size: 1.8rem;
      margin-left: auto;
      margin-right: auto;
      color: #6c5ce7;
    }
    .letter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      gap: 15px;
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      align-content: start;
    }
    .letter-card {
      background: #fff;
      border: 3px solid #dfe6e9;
      border-radius: 18px;
      aspect-ratio: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Baloo 2', cursive;
      font-size: 2.2rem;
      font-weight: 900;
      color: #2d3436;
      cursor: pointer;
      box-shadow: 0 5px 0 #dfe6e9;
      transition: transform 0.1s;
    }
    .letter-card:active { transform: scale(0.95); }
    .letter-card.arabic-char { font-family: 'Amiri', serif; font-size: 3rem; }
    .letter-card.shape-char { font-size: 2.5rem; color: #e17055; }

    /* --- TRACING SCREEN --- */
    #drawScreen { background: #fff; position: relative; }
    .draw-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #fff;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
      z-index: 10;
    }
    .draw-title {
      font-family: 'Baloo 2', cursive;
      font-size: 2rem;
      color: #6c5ce7;
    }
    
    .canvas-container {
      flex: 1;
      position: relative;
      width: 100%;
      background: #fafafa;
      background-image: radial-gradient(#f1f2f6 20%, transparent 20%);
      background-position: 0 0;
      background-size: 30px 30px;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }
    
    /* --- COLOR PALETTE --- */
    .color-palette {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 15px 10px;
      background: #fff;
      overflow-x: auto;
    }
    .color-swatch {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .color-swatch.active {
      transform: scale(1.2);
      border-color: #333;
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 10px 20px 25px;
      background: #fff;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
    }
    .ctrl-btn {
      border: none;
      border-radius: 50%;
      width: 70px;
      height: 70px;
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 0 rgba(0,0,0,0.15);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .ctrl-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 rgba(0,0,0,0.15); }
    .btn-clear { background: #ffeaa7; color: #d63031; }
    .btn-speak { background: #74b9ff; color: #fff; }
    .btn-next { background: #55efc4; color: #00b894; }

    /* Start indicator animation */
    .start-dot {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #00b894;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(0, 184, 148, 0.4);
      animation: pulse 1.5s infinite;
      pointer-events: none;
      z-index: 5;
      display: none;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 184, 148, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(0, 184, 148, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 184, 148, 0); }
    }

  </style>
</head>
<body>

  <!-- 1. HOME SCREEN -->
  <div id="homeScreen" class="screen active">
    <h1 class="title">Magic<br>Tracing</h1>
    <div class="category-grid">
      <button class="cat-btn btn-abc" onclick="openCategory('abc')"><span>A B C</span></button>
      <button class="cat-btn btn-123" onclick="openCategory('num')"><span>1 2 3</span></button>
      <button class="cat-btn btn-arabic" onclick="openCategory('ar')"><span>ا ب ت</span></button>
      <button class="cat-btn btn-shapes" onclick="openCategory('shapes')"><span>🔺 ⚪</span></button>
    </div>
  </div>

  <!-- 2. LETTER SELECTION SCREEN -->
  <div id="selectScreen" class="screen">
    <div class="header">
      <button class="back-btn" onclick="goHome()">⬅ वापस</button>
      <div class="header-title" id="selectTitle">Letters</div>
      <div style="width: 80px;"></div> <!-- Spacer -->
    </div>
    <div class="letter-grid" id="letterGrid">
      <!-- Letters injected here -->
    </div>
  </div>

  <!-- 3. DRAWING SCREEN -->
  <div id="drawScreen" class="screen">
    <div class="draw-header">
      <button class="back-btn" onclick="goBackToSelect()">⬅ वापस</button>
      <div class="draw-title" id="currentLetterTitle">A</div>
      <div style="width: 80px;"></div>
    </div>
    
    <div class="canvas-container">
      <div id="startDot" class="start-dot"></div>
      <canvas id="drawCanvas"></canvas>
    </div>

    <!-- Color Palette -->
    <div class="color-palette">
      <div class="color-swatch active" style="background:#FF7675;" onclick="setColor('#FF7675', this)"></div>
      <div class="color-swatch" style="background:#0984e3;" onclick="setColor('#0984e3', this)"></div>
      <div class="color-swatch" style="background:#00b894;" onclick="setColor('#00b894', this)"></div>
      <div class="color-swatch" style="background:#fdcb6e;" onclick="setColor('#fdcb6e', this)"></div>
      <div class="color-swatch" style="background:#e84393;" onclick="setColor('#e84393', this)"></div>
      <div class="color-swatch" style="background:#a29bfe;" onclick="setColor('#a29bfe', this)"></div>
      <div class="color-swatch" style="background:#636e72;" onclick="setColor('#636e72', this)"></div>
    </div>

    <div class="controls">
      <button class="ctrl-btn btn-clear" onclick="clearCanvas()">🧽</button>
      <button class="ctrl-btn btn-speak" onclick="speakCurrent()">🔊</button>
      <button class="ctrl-btn btn-next" onclick="nextLetter()">➡️</button>
    </div>
  </div>

  <script>
    /* =========================================================
       1. DATA & STATE
       ========================================================= */
    const DATA = {
      abc: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
      num: '1234567890'.split(''),
      ar: ['ا', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 'ل', 'م', 'ن', 'و', 'ه', 'ي'],
      shapes: ['Circle', 'Square', 'Triangle', 'Star', 'Heart']
    };

    const SPEECH_TEXT = {
      ar: { 'ا': 'Alif', 'ب': 'Baa', 'ت': 'Taa', 'ث': 'Thaa', 'ج': 'Jeem', 'ح': 'Haa', 'خ': 'Khaa', 'د': 'Daal', 'ذ': 'Dhaal', 'ر': 'Raa', 'ز': 'Zaa', 'س': 'Seen', 'ش': 'Sheen', 'ص': 'Saad', 'ض': 'Daad', 'ط': 'Taa', 'ظ': 'Zaa', 'ع': 'Ain', 'غ': 'Ghain', 'ف': 'Faa', 'ق': 'Qaaf', 'ك': 'Kaaf', 'ل': 'Laam', 'م': 'Meem', 'ن': 'Noon', 'و': 'Waw', 'ه': 'Haa', 'ي': 'Yaa' },
      shapes: { 'Circle': 'Circle', 'Square': 'Square', 'Triangle': 'Triangle', 'Star': 'Star', 'Heart': 'Heart' }
    };

    let currentCategory = '';
    let currentIndex = 0;
    let currentColor = '#FF7675'; // Default pink/red
    
    // Canvas variables
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const startDot = document.getElementById('startDot');
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    let canvasWidth, canvasHeight;
    let dpr = window.devicePixelRatio || 1;

    /* =========================================================
       2. AUDIO SYNTHESIS
       ========================================================= */
    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'en-US';
      utt.rate = 0.85;
      
      const voices = speechSynthesis.getVoices();
      const preferred = voices.find(v => v.lang.includes('en') && (v.name.includes('Google') || v.name.includes('Samantha')));
      if (preferred) utt.voice = preferred;
      
      speechSynthesis.speak(utt);
    }

    /* =========================================================
       3. NAVIGATION LOGIC
       ========================================================= */
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      startDot.style.display = 'none'; // hide dot by default
    }

    function goHome() {
      showScreen('homeScreen');
    }

    function openCategory(cat) {
      currentCategory = cat;
      const grid = document.getElementById('letterGrid');
      grid.innerHTML = '';
      
      let title = "Letters";
      if (cat === 'abc') title = "A B C";
      if (cat === 'num') title = "1 2 3";
      if (cat === 'ar') title = "अलिफ़ बा ता";
      if (cat === 'shapes') title = "आकार (Shapes)";
      
      document.getElementById('selectTitle').textContent = title;

      DATA[cat].forEach((char, index) => {
        const btn = document.createElement('button');
        btn.className = 'letter-card';
        if (cat === 'ar') btn.classList.add('arabic-char');
        
        // Show emoji for shapes in grid
        if (cat === 'shapes') {
           btn.classList.add('shape-char');
           if(char === 'Circle') btn.textContent = '🔵';
           if(char === 'Square') btn.textContent = '🟥';
           if(char === 'Triangle') btn.textContent = '🔺';
           if(char === 'Star') btn.textContent = '⭐';
           if(char === 'Heart') btn.textContent = '❤️';
        } else {
           btn.textContent = char;
        }
        
        btn.onclick = () => openDrawScreen(index);
        grid.appendChild(btn);
      });

      showScreen('selectScreen');
    }

    function goBackToSelect() {
      openCategory(currentCategory);
    }

    function openDrawScreen(index) {
      currentIndex = index;
      const item = DATA[currentCategory][currentIndex];
      
      // Set title
      if (currentCategory === 'shapes') {
        document.getElementById('currentLetterTitle').textContent = item;
      } else {
        document.getElementById('currentLetterTitle').textContent = item;
      }
      
      showScreen('drawScreen');
      
      // Delay slightly to ensure canvas container is sized
      setTimeout(() => {
        resizeCanvas();
        drawGuide(item);
        speakItem(item);
      }, 100);
    }

    function speakItem(item) {
      if (currentCategory === 'ar') {
        speak(SPEECH_TEXT.ar[item] || item);
      } else if (currentCategory === 'shapes') {
        speak(SPEECH_TEXT.shapes[item] || item);
      } else {
        speak(item);
      }
    }

    function speakCurrent() {
      speakItem(DATA[currentCategory][currentIndex]);
    }

    function nextLetter() {
      currentIndex++;
      if (currentIndex >= DATA[currentCategory].length) {
        currentIndex = 0; // Loop back
      }
      const item = DATA[currentCategory][currentIndex];
      
      if (currentCategory === 'shapes') {
        document.getElementById('currentLetterTitle').textContent = item;
      } else {
        document.getElementById('currentLetterTitle').textContent = item;
      }
      
      clearCanvas();
      drawGuide(item);
      speakItem(item);
      
      createConfetti();
    }

    /* =========================================================
       4. COLOR SELECTION
       ========================================================= */
    function setColor(color, swatchEl) {
      currentColor = color;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      
      // Update active swatch UI
      document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));
      swatchEl.classList.add('active');
      
      // Animate the swatch
      swatchEl.style.transform = "scale(1.4)";
      setTimeout(() => swatchEl.style.transform = "scale(1.2)", 150);
    }

    /* =========================================================
       5. CANVAS DRAWING & TRACING
       ========================================================= */
    function resizeCanvas() {
      const container = canvas.parentElement;
      const rect = container.getBoundingClientRect();
      
      dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      
      canvasWidth = rect.width;
      canvasHeight = rect.height;
      
      ctx.scale(dpr, dpr);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 20;
      ctx.strokeStyle = currentColor;
    }

    function drawShapePath(shape, cx, cy, size) {
      ctx.beginPath();
      if (shape === 'Circle') {
        ctx.arc(cx, cy, size, 0, Math.PI * 2);
      } else if (shape === 'Square') {
        ctx.rect(cx - size, cy - size, size * 2, size * 2);
      } else if (shape === 'Triangle') {
        ctx.moveTo(cx, cy - size);
        ctx.lineTo(cx + size, cy + size);
        ctx.lineTo(cx - size, cy + size);
        ctx.closePath();
      } else if (shape === 'Star') {
        let rot = Math.PI / 2 * 3;
        let x = cx;
        let y = cy;
        let step = Math.PI / 5;
        let outerR = size;
        let innerR = size / 2;
        ctx.moveTo(cx, cy - outerR);
        for (let i = 0; i < 5; i++) {
          x = cx + Math.cos(rot) * outerR;
          y = cy + Math.sin(rot) * outerR;
          ctx.lineTo(x, y);
          rot += step;
          x = cx + Math.cos(rot) * innerR;
          y = cy + Math.sin(rot) * innerR;
          ctx.lineTo(x, y);
          rot += step;
        }
        ctx.closePath();
      } else if (shape === 'Heart') {
        let topCurveHeight = size * 0.3;
        ctx.moveTo(cx, cy + topCurveHeight);
        // left curve
        ctx.bezierCurveTo(cx, cy, cx - size / 2, cy, cx - size, cy + topCurveHeight);
        // right curve
        ctx.bezierCurveTo(cx - size, cy + (size + topCurveHeight) / 2, cx, cy + (size + topCurveHeight) / 2, cx, cy + size);
        // right curve
        ctx.bezierCurveTo(cx, cy + (size + topCurveHeight) / 2, cx + size, cy + (size + topCurveHeight) / 2, cx + size, cy + topCurveHeight);
        // left curve
        ctx.bezierCurveTo(cx + size / 2, cy, cx, cy, cx, cy + topCurveHeight);
      }
      ctx.stroke();
    }

    function drawGuide(item) {
      clearCanvas();
      
      ctx.save();
      
      // Draw thick, light, solid guide (No Dots)
      ctx.strokeStyle = '#dfe6e9'; 
      ctx.lineWidth = 45;
      
      const centerX = canvasWidth / 2;
      const centerY = canvasHeight / 2;
      
      if (currentCategory === 'shapes') {
        const size = Math.min(canvasWidth, canvasHeight) * 0.3;
        drawShapePath(item, centerX, centerY, size);
        
        // Show start dot at top center
        if(item === 'Circle' || item === 'Triangle' || item === 'Star') {
            showStartDot(centerX, centerY - size);
        } else if(item === 'Square') {
            showStartDot(centerX - size, centerY - size);
        } else if(item === 'Heart') {
            showStartDot(centerX, centerY - size*0.3);
        }
        
      } else {
        let fontSize = Math.min(canvasWidth, canvasHeight) * 0.6;
        if (currentCategory === 'ar') {
          ctx.font = `bold ${fontSize}px "Amiri", "Traditional Arabic", serif`;
        } else {
          ctx.font = `900 ${fontSize}px "Baloo 2", "Arial", sans-serif`;
        }
        
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        // Draw the letter shape
        ctx.strokeText(item, centerX, centerY);
        
        // Show start dot at top left of the letter roughly
        showStartDot(centerX - fontSize*0.35, centerY - fontSize*0.4);
      }
      
      ctx.restore();

      // Reset for user drawing
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = 20;
    }

    function showStartDot(x, y) {
      startDot.style.display = 'block';
      startDot.style.left = (x - 10) + 'px'; // 10 is half of width
      startDot.style.top = (y - 10) + 'px';
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);
    }

    // --- Drawing Events ---
    function getCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      let clientX, clientY;
      
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrawing(e) {
      e.preventDefault();
      isDrawing = true;
      const pos = getCoordinates(e);
      lastX = pos.x;
      lastY = pos.y;
      
      ctx.beginPath();
      ctx.arc(lastX, lastY, 10, 0, Math.PI * 2);
      ctx.fillStyle = currentColor;
      ctx.fill();
      
      // Hide start dot once they begin drawing
      startDot.style.display = 'none';
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      
      const pos = getCoordinates(e);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      
      if (Math.random() > 0.85) createSparkle(pos.x, pos.y);
      
      lastX = pos.x;
      lastY = pos.y;
    }

    function stopDrawing(e) {
      if (e) e.preventDefault();
      isDrawing = false;
    }

    // Attach Events
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing, { passive: false });
    canvas.addEventListener('touchcancel', stopDrawing, { passive: false });

    /* =========================================================
       6. VISUAL EFFECTS
       ========================================================= */
    function createSparkle(x, y) {
      const sparkle = document.createElement('div');
      sparkle.textContent = '✨';
      sparkle.style.position = 'absolute';
      sparkle.style.left = (x + canvas.getBoundingClientRect().left) + 'px';
      sparkle.style.top = (y + canvas.getBoundingClientRect().top) + 'px';
      sparkle.style.fontSize = '1.2rem';
      sparkle.style.pointerEvents = 'none';
      sparkle.style.transition = 'all 0.5s ease-out';
      document.body.appendChild(sparkle);

      setTimeout(() => {
        sparkle.style.transform = 'translateY(-20px) scale(0) rotate(45deg)';
        sparkle.style.opacity = '0';
      }, 10);

      setTimeout(() => sparkle.remove(), 500);
    }

    function createConfetti() {
      const icons = ['⭐', '🌟', '✨', '🎈'];
      for (let i = 0; i < 15; i++) {
        const c = document.createElement('div');
        c.textContent = icons[Math.floor(Math.random() * icons.length)];
        c.style.position = 'fixed';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.top = '-20px';
        c.style.fontSize = (Math.random() * 20 + 15) + 'px';
        c.style.zIndex = '9999';
        c.style.pointerEvents = 'none';
        
        document.body.appendChild(c);
        
        const dur = Math.random() * 1.5 + 1;
        c.style.transition = `transform ${dur}s linear, opacity ${dur}s`;
        
        setTimeout(() => {
          c.style.transform = `translateY(${window.innerHeight}px) rotate(${Math.random()*360}deg)`;
          c.style.opacity = '0';
        }, 10);

        setTimeout(() => c.remove(), dur * 1000);
      }
    }

    // Handle resize
    window.addEventListener('resize', () => {
      if (document.getElementById('drawScreen').classList.contains('active')) {
        resizeCanvas();
        drawGuide(DATA[currentCategory][currentIndex]);
      }
    });

    if ("speechSynthesis" in window) {
      speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
